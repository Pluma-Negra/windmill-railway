version: '3.8'

services:
  windmill:
    image: ghcr.io/windmill-labs/windmill:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RUST_LOG: info
    depends_on:
      - postgres
    networks:
      - windmill-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-windmill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windmillpass}
      POSTGRES_DB: ${POSTGRES_DB:-windmill}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - windmill-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-windmill}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  windmill-network:
    driver: bridge